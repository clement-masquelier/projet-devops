name: Configure Infrastructure with Ansible

on:
    push:
        branches:
            - main

jobs:
    infra:
        name: Provision & Configure VMs
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  clean: false

            - name: Generate SSH Key Pair
              run: |
                  wsl sed -i 's/\r$//' ./scripts/generate_key_pair.sh
                  wsl chmod +x ./scripts/generate_key_pair.sh 
                  wsl bash ./scripts/generate_key_pair.sh

            - name: Copy SSH Key to WSL
              run: |
                  wsl cp ./ssh_keys/k3s_ansible_key ~/.ssh/k3s_ansible_key
                  wsl chmod 600 ~/.ssh/k3s_ansible_key

            - name: Vagrant Up
              run: |
                  vagrant up

            - name: Wait for VMs to be ready
              run: |
                  Start-Sleep -Seconds 20

            - name: Ansible playbook for k3s installation
              env:
                  ANSIBLE_TIMEOUT: 60
              run: |
                  wsl ansible-playbook -i ansible/inventory.ini ansible/k3s-install.yaml

    build-and-push:
        runs-on: self-hosted
        needs: infra
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Login to DockerHub
              run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              run: |
                  docker build -t clmtm/devops_final:latest .
                  docker push clmtm/devops_final:latest

    deploy-app:
        runs-on: self-hosted
        needs: build-and-push
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Apply K8s Manifests (via WSL)
              run: |
                  wsl kubectl apply -f k8s/
                  wsl kubectl rollout restart deployment api-lacet
